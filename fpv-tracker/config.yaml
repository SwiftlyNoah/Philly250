video:
  device_index: 0
  width: 720
  height: 480
  crop: [20, 20, 700, 460]    # x, y, w, h
  flip: false

pixel_tracker:
  feature_count: 300
  feature_quality: 0.01
  feature_min_distance: 10
  lk_window_size: 21
  lk_pyramid_levels: 3
  ransac_threshold: 3.0
  min_inlier_ratio: 0.5
  diff_threshold: 20        # lowered for faint / few-pixel targets
  blur_kernel: 3             # smaller blur preserves tiny blobs
  morph_kernel: 3
  min_blob_area: 1
  max_blob_area: 500
  search_radius: 120
  edge_margin: 20            # reduced so edge-hugging targets aren't masked
  target_exclusion_radius: 30

kalman:
  process_noise: 0.01
  measurement_noise: 0.1
  max_frames_lost: 30
  confidence_engage: 0.7
  confidence_disengage: 0.2

yolo:
  model_path: "models/best.pt"
  confidence_threshold: 0.25
  imgsz: 1280
  # Sliced inference (SAHI-style) — dramatically improves recall on
  # tiny / distant drones by running the model on overlapping tiles.
  slice_inference:
    enabled: false          # set to true when tracking very small drones
    slice_size: 640         # tile side length in pixels
    overlap: 0.25           # fractional overlap between adjacent tiles
    nms_threshold: 0.5      # IoU threshold for merging duplicate detections

audio:
  enabled: true
  volume: 0.7
  min_beep_interval: 0.1
  max_beep_interval: 1.0
  deadzone_pixels: 15

logging:
  enabled: true
  output_dir: "logs/"

overlay:
  trajectory_length: 100
  arrow_scale: 1.5
  lead_indicator_frames: 10
